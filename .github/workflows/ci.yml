name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Card SBM-2, Test design: only the acceptance checks so far; the java and ui jobs come in Build.
  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: AC1 pull request or push to main starts the Java and UI tests
        if: always()
        run: bash .github/acceptance/AC1_pull_request_or_push_to_main_starts_java_and_ui_tests.sh
      - name: AC2 fails when a Java or UI test fails
        if: always()
        run: bash .github/acceptance/AC2_fails_when_a_java_or_ui_test_fails.sh
      - name: AC3 no existing source, test or build file changes
        if: always()
        run: bash .github/acceptance/AC3_no_existing_source_test_or_build_file_changes.sh origin/${{ github.base_ref || 'main' }}

  ac4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: AC4 passes, running every existing test
        run: bash .github/acceptance/AC4_passes_running_every_existing_test.sh reports/java reports/ui/ui-test.log origin/main
