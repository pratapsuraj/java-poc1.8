name: ci

# Card SBM-2: run the Java and UI tests on every pull request and on every push to main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
      # A failed test is retried up to 2 times (card SBM-2, decision 2a): one existing class is
      # flaky (risk SBM-3). A test that fails all three times still fails the build.
      # Test classes run in random order (card SBM-6): each test context owns its report folder, so the
      # tests must pass in any order, and a new order dependence shows up here rather than later.
      # The log is kept so the next step can show the order this run used (surefire 2.22.2 prints no seed).
      - name: Java tests
        run: |
          set -o pipefail
          mvn -B clean test -Dsurefire.rerunFailingTestsCount=2 -Dsurefire.runOrder=random 2>&1 | tee "$RUNNER_TEMP/java-test.log"
      # Shows the class order with a command to repeat it, and fails when a test passed only on a retry
      # outside the classes of the known approval race, so a retry cannot hide a new order dependence.
      - name: Java run order, and no retries outside the known race
        if: always()
        run: python3 .github/scripts/java_run_order.py "$RUNNER_TEMP/java-test.log" .
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-test-reports
          path: '**/target/surefire-reports/TEST-*.xml'
          if-no-files-found: warn

  ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install
        run: npm ci
      - name: UI tests
        run: |
          set -o pipefail
          mkdir -p ../reports/ui
          npx ng test --watch=false --browsers=ChromeHeadless 2>&1 | tee ../reports/ui/ui-test.log
      - name: Keep the test log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-log
          path: reports/ui/ui-test.log
          if-no-files-found: warn

  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: AC1 pull request or push to main starts the Java and UI tests
        if: always()
        run: bash .github/acceptance/AC1_pull_request_or_push_to_main_starts_java_and_ui_tests.sh
      - name: AC2 fails when a Java or UI test fails
        if: always()
        run: bash .github/acceptance/AC2_fails_when_a_java_or_ui_test_fails.sh
      # SBM-2's AC3 (no existing file changes) held for SBM-2's own pull request only; removed by card SBM-6
      # (answer to SBM-Q9), since every later card changes code or tests.

  ac4:
    needs: [java, ui]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: java-test-reports
          path: reports/java
      - uses: actions/download-artifact@v8
        with:
          name: ui-test-log
          path: reports/ui
      - name: AC4 passes, running every existing test
        run: bash .github/acceptance/AC4_passes_running_every_existing_test.sh reports/java reports/ui/ui-test.log origin/main
