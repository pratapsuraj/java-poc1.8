# Web server
server.port=8080

# Activiti uses an in-memory H2 database. Swap for MySQL/Postgres by changing EngineConfig.
# Where the published report is written
report.dir=/tmp/sales-batch-reports

# How the Spark job is launched (override with -Dspark.master=local[*] for local runs)
spark.submit.command=spark-submit
spark.master=yarn
spark.deploy.mode=cluster
spark.main.class=com.example.salesbatch.spark.SalesAggregator
spark.job.jar=spark-job/target/spark-job-1.0.0-SNAPSHOT.jar
# Passed to --files so the driver and executors find ZooKeeper. Leave empty when running locally with HBase on localhost.
spark.hbase.site=/etc/hbase/conf/hbase-site.xml
